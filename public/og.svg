    <circle cx="26.4" cy="24.4" r="1.8" fill="#22D3EE"/>
    <circle cx="20.4" cy="31.6" r="1.9" fill="#A78BFA"/>
    <circle cx="14.6" cy="38.4" r="1.9" fill="#E879F9"/>
