<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- YAZIMAO Symbol —— Feather + Network（羽毛 × 网络），深色瓦片 -->
  <defs>
    <linearGradient id="yzm" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#070A11"/>
  <g transform="translate(1 1) scale(2)">
    <!-- 羽身（斜向羽管，填充+描边） -->
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" fill="url(#yzm)" stroke="url(#yzm)" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- 羽轴 -->
    <line x1="16" y1="8" x2="2.4" y2="21.6" stroke="url(#yzm)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 网络节点 -->
    <circle cx="2.4" cy="21.6" r="1.5" fill="url(#yzm)"/>
    <circle cx="21.6" cy="16.8" r="1.05" fill="url(#yzm)"/>
    <circle cx="19.4" cy="5.6" r="0.9" fill="url(#yzm)"/>
    <circle cx="10.6" cy="4.2" r="0.75" fill="url(#yzm)"/>
  </g>
</svg>
