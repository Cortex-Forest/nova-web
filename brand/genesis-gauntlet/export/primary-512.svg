<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" role="img" aria-label="YAZIMAO Genesis Gauntlet — seven founding nodes">
  <title>YAZIMAO Genesis Gauntlet</title>
  <desc>An original geometric armoured gauntlet: four faceted finger plates, a chamfered hand plate, a segmented forearm cuff and a separate thumb plate, carrying seven genesis nodes (four cyan on the fingers, three violet on the hand plate and cuff). Plates are separated by real gaps, so the mark works in one colour.</desc>

  <defs>
    <linearGradient id="gx-plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#D3DCEC"/>
      <stop offset="1" stop-color="#8B9CB6"/>
    </linearGradient>
    <linearGradient id="gx-plate2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#9DB0C9"/>
    </linearGradient>
    <radialGradient id="gx-aura" cx="0.5" cy="0.42" r="0.56">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="gx-bloom" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="gx-hex" d="M0 -3.4 L2.94 -1.7 L2.94 1.7 L0 3.4 L-2.94 1.7 L-2.94 -1.7 Z"/>
  </defs>

  <ellipse cx="60" cy="56" rx="43" ry="46" fill="url(#gx-aura)"/>

  <!-- fingertip plates: flat chamfered tips, not round caps -->
  <g fill="url(#gx-plate)">
    <path d="M31.5 64.5 L31.5 34 L35.5 30 L40.5 30 L44.5 34 L44.5 64.5 Z"/>
    <path d="M64.5 64.5 L64.5 30 L68.5 26 L73.5 26 L77.5 30 L77.5 64.5 Z"/>
    <path d="M81 64.5 L81 42 L85 38 L90 38 L94 42 L94 64.5 Z"/>
  </g>
  <g fill="url(#gx-plate2)">
    <path d="M48 64.5 L48 26 L52 22 L57 22 L61 26 L61 64.5 Z"/>
  </g>

  <!-- hand plate -->
  <path fill="url(#gx-plate)" d="M34 67 L34 76 L28.5 81.5 L28.5 87 L34.5 94.5 L85.5 94.5 L91.5 87 L91.5 81.5 L86 76 L86 67 Z"/>

  <!-- thumb plate, separated from the hand plate by a real gap -->
  <path fill="url(#gx-plate2)" d="M24.5 82.5 L5 63 L8.5 56 L27.5 70 Z"/>

  <!-- segmented forearm cuff -->
  <path fill="url(#gx-plate)" d="M35 97 L30 103 L30 111 L36.5 118 L83.5 118 L90 111 L90 103 L85 97 Z"/>

  <!-- SEVEN GENESIS NODES: four hexagonal crystals on the fingers (cyan),
       three on the hand plate and cuff (violet) -->
  <g filter="url(#gx-bloom)">
    <use href="#gx-hex" transform="translate(38 36)" fill="#22D3EE"/>
    <use href="#gx-hex" transform="translate(54.5 28)" fill="#22D3EE"/>
    <use href="#gx-hex" transform="translate(71 32)" fill="#22D3EE"/>
    <use href="#gx-hex" transform="translate(87.5 44)" fill="#22D3EE"/>
    <use href="#gx-hex" transform="translate(42 86)" fill="#A78BFA"/>
    <use href="#gx-hex" transform="translate(78 86)" fill="#A78BFA"/>
    <use href="#gx-hex" transform="translate(60 107)" fill="#A78BFA"/>
  </g>
</svg>

