<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="YAZIMAO app icon">
  <title>YAZIMAO app icon</title>
  <desc>App icon master: deep black squircle with the YAZIMAO hands-and-feather symbol and a restrained cyan aura.</desc>

  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.55" stop-color="#05080F"/>
      <stop offset="1" stop-color="#04060B"/>
    </linearGradient>
    <radialGradient id="ai-aura" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="ai-hand" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E7ECF6"/>
      <stop offset="1" stop-color="#A3B1C7"/>
    </linearGradient>
    <linearGradient id="ai-feather" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F5F8FF"/>
      <stop offset="1" stop-color="#B4C1D6"/>
    </linearGradient>
    <linearGradient id="ai-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="ai-bloom" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#ai-bg)"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="115.25"
        fill="none" stroke="url(#ai-rim)" stroke-width="1.5"/>

  <g transform="translate(94, 74) scale(2.9)">
    <ellipse cx="58" cy="56" rx="40" ry="44" fill="url(#ai-aura)"/>

    <g transform="translate(-4,-1)">
      <g fill="url(#ai-hand)">
        <path d="M28.48 98.63 A40 40 0 0 0 51.68 113.12 L53.55 104.32 A31 31 0 0 1 35.57 93.09 Z"/>
        <path d="M91.52 98.63 A40 40 0 0 1 68.32 113.12 L66.45 104.32 A31 31 0 0 0 84.43 93.09 Z"/>
      </g>

      <g transform="rotate(24 60 94)">
        <path d="M60 12 C 47 32, 44.5 64, 60 94 C 75.5 64, 73 32, 60 12 Z" fill="url(#ai-feather)"/>

        <g stroke="#8FA0B8" stroke-width="1.05" stroke-linecap="round" opacity="0.5">
          <path d="M60 38 L52.5 34"/>
          <path d="M60 38 L67.5 34"/>
          <path d="M60 62 L52.5 58"/>
          <path d="M60 62 L67.5 58"/>
        </g>

        <path d="M60 88 L60 16" stroke="#7C8AA3" stroke-width="1.7" stroke-linecap="round" opacity="0.8"/>

        <g stroke="url(#ai-cyan)" stroke-width="1.15" stroke-linecap="round" opacity="0.95">
          <path d="M62.6 30 L57.4 45"/>
          <path d="M57.4 45 L62.6 60"/>
          <path d="M62.6 60 L57.4 75"/>
        </g>
        <g fill="url(#ai-cyan)" filter="url(#ai-bloom)">
          <circle cx="62.6" cy="30" r="2.3"/>
          <circle cx="57.4" cy="45" r="2.3"/>
          <circle cx="62.6" cy="60" r="2.3"/>
          <circle cx="57.4" cy="75" r="2.3"/>
        </g>
      </g>
    </g>
  </g>
</svg>
